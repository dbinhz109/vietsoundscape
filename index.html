<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bản đồ âm thanh Việt Nam</title>
    <meta
      name="description"
      content="Nền tảng web thu thập, mô phỏng và bảo tồn không gian âm thanh đặc trưng của các vùng miền Việt Nam."
    />
  </head>
  <body>
    <div class="shell">
      <main class="panel">
        <header class="masthead">
          <h1>Bản đồ âm thanh Việt Nam</h1>
          <p>Nghe một vùng đất — thu thập, phân loại và mô phỏng không gian âm thanh</p>
        </header>

        <p id="status" role="status" aria-live="polite">Đang tải…</p>

        <section aria-labelledby="locations-heading">
          <h2 id="locations-heading" class="sr-heading">Địa điểm</h2>
          <ul id="location-list" class="location-list"></ul>
        </section>

        <section id="room" aria-labelledby="room-heading" aria-live="polite"></section>

        <button id="stop" type="button" class="stop-button">Dừng và ngắt kết nối</button>
      </main>

      <div id="map" role="application" aria-label="Bản đồ các điểm âm thanh trên lãnh thổ Việt Nam"></div>
    </div>

    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>
